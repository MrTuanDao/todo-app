<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>To-Do List</h1>
    <form action="{{ url_for('add_task') }}" method="POST">
        <input type="text" name="title" placeholder="Enter a task" required>
        <button type="submit">Add Task</button>
    </form>

    {% if edit_task %}
        <h2>Edit Task</h2>
        <form action="{{ url_for('edit_task', task_id=edit_task.id) }}" method="POST">
            <input type="text" name="title" value="{{ edit_task.title }}" required>
            <button type="submit">Save</button>
            <a href="{{ url_for('index') }}">Cancel</a>
        </form>
    {% endif %}

    <ul>
        {% for task in tasks %}
        <li class="{% if task.completed %}completed{% endif %}">
            {{ task.title }}
            <a href="{{ url_for('complete_task', task_id=task.id) }}">Complete</a>
            <a href="{{ url_for('delete_task', task_id=task.id) }}">Delete</a>
            <a href="{{ url_for('edit_task', task_id=task.id) }}">Edit</a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
